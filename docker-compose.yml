version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: streamhub_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: streamdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - stream_network

  redis:
    image: redis:7-alpine
    container_name: streamhub_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - stream_network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: streamhub_rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER:-streamhub}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS:-streamhub-local-password}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - stream_network

  blob-storage:
    image: chrislusf/seaweedfs:latest
    container_name: streamhub_blob_storage
    restart: unless-stopped
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["chmod -R a+rwX /data && exec su-exec seaweed /usr/bin/weed -logtostderr=true server -dir=/data -master.telemetry=false -s3 -s3.iam=false -volume.max=30"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9333/dir/status | grep -q '\"Volumes\":[1-9]'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    expose:
      - "8333"
    volumes:
      - object_storage_data:/data
    networks:
      - stream_network

  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: streamhub_elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms256m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - stream_network

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: streamhub_mediamtx
    restart: unless-stopped
    ports:
      - "1935:1935"
      - "8888:8888"
    volumes:
      - ./media/mediamtx.yml:/mediamtx.yml:ro
    networks:
      - stream_network

  core-service:
    build:
      context: ./services/core
      dockerfile: Dockerfile
    container_name: streamhub_core
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/streamdb
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_DIR=/storage
      - S3_ENDPOINT_URL=http://blob-storage:8333
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-streamhub}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-streamhub-local-secret}
      - S3_REGION=us-east-1
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - MEDIAMTX_API_URL=http://mediamtx:9997/v3/paths/list
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:-streamhub-local-internal-token}
      - JWT_SECRET=${JWT_SECRET:-streamhub-dev-jwt-secret-change-before-production}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-@streamhub_live_alerts}
      - RABBITMQ_URL=${RABBITMQ_URL:-amqp://streamhub:streamhub-local-password@rabbitmq:5672/}
    volumes:
      - ./services/core:/app
      - stream_storage:/storage
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
      mediamtx:
        condition: service_started
      elasticsearch:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      blob-storage:
        condition: service_healthy
    networks:
      - stream_network

  chat-service:
    build:
      context: ./services/chat
      dockerfile: Dockerfile
    container_name: streamhub_chat
    restart: unless-stopped
    volumes:
      - ./services/chat:/app
    ports:
      - "8001:8001"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CORE_API_URL=http://core-service:8000
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:-streamhub-local-internal-token}
      - JWT_SECRET=${JWT_SECRET:-streamhub-dev-jwt-secret-change-before-production}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-@streamhub_live_alerts}
    depends_on:
      - redis
    networks:
      - stream_network

  ai-agent:
    build:
      context: ./services/ai-agent
      dockerfile: Dockerfile
    container_name: streamhub_ai_agent
    restart: unless-stopped
    volumes:
      - ./services/ai-agent:/app
    environment:
      - REDIS_URL=redis://redis:6379/0
      - LOCAL_LLM_BASE_URL=${LOCAL_LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      - MODEL_NAME=${MODEL_NAME:-qwen2.5-coder:7b}
      - CORE_API_URL=http://core-service:8000
    ports:
      - "8002:8002"
    depends_on:
      - redis
    networks:
      - stream_network

  transcoder:
    build:
      context: ./services/transcoder
      dockerfile: Dockerfile
    container_name: streamhub_transcoder
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/streamdb
    volumes:
      - ./services/transcoder:/app
      - stream_storage:/storage
    depends_on:
      - mediamtx
      - db
    networks:
      - stream_network

volumes:
  pgdata:
  stream_storage:
  es_data:
  object_storage_data:
  rabbitmq_data:

networks:
  stream_network:
    driver: bridge
